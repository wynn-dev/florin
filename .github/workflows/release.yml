# On a v* tag: check, build and package florin for every platform, test the
# installer on the Linux build, and publish the tarballs and checksums.txt as
# a GitHub Release, where install.sh finds them.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Check the tag matches package.json
        run: |
          version=$(node -p 'require("./package.json").version')
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "The tag is $GITHUB_REF_NAME but package.json says $version" >&2
            exit 1
          }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: scripts/package.sh
      - name: Install with install.sh in a clean container without Node
        run: scripts/test-install.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/florin-*.tar.gz dist/checksums.txt \
            --verify-tag --title "florin ${GITHUB_REF_NAME#v}" --generate-notes
